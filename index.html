    <script>
      // Make window.fetch writable with getter/setter to prevent Chrome extension errors
      try {
        let _activeFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function () {
            return _activeFetch;
          },
          set: function (newFetch) {
            _activeFetch = newFetch;
          },
        });
      } catch (err) {}

      // Prevent third-party browser extension errors from interrupting the applet
      window.addEventListener('error', function (event) {
        if (event.filename && event.filename.includes('chrome-extension://')) {
          event.stopImmediatePropagation();
        }
      });
    </script>
